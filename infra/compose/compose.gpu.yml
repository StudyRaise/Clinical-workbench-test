version: '3.9'

services:
  inference:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.inference.gpu
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_PROVIDER_URL: ${LLM_PROVIDER_URL:-https://api.openai.com/v1}
    ports:
      - '8001:8001'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
