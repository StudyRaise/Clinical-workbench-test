[project]
name = "batch-jobs"
version = "0.1.0"
description = "Batch workloads for nightly evaluations, indexing, and training"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6.0,<3.0.0",
  "typer>=0.9.0,<1.0.0",
  "httpx>=0.26.0,<1.0.0"
]

[project.scripts]
nightly-eval = "jobs.nightly_eval:app"
index-builder = "jobs.index_builder:app"

[tool.uv]
devenv = true
