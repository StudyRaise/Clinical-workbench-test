[project]
name = "inference-service"
version = "0.1.0"
description = "FastAPI microservice for LLM, embeddings, and reranking"
authors = [{ name = "AI SaaS" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0,<1.0.0",
  "uvicorn[standard]>=0.27.1,<1.0.0",
  "pydantic>=2.6.0,<3.0.0",
  "httpx>=0.26.0,<1.0.0",
  "tenacity>=8.2.3,<9.0.0",
  "redis>=5.0.1,<6.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0"]

[tool.uv]
devenv = true
